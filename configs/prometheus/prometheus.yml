global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: snmp-device
    metrics_path: /snmp
    scrape_interval: 30s
    scrape_timeout: 20s
    params:
      auth:
        - public_v2
      module:
        - if_mib
    static_configs:
      - targets:
          - snmp-agent:161
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
