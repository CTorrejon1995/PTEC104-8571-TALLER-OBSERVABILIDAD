server:
  http_listen_address: 0.0.0.0
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml
  sync_period: 2s

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    backoff_config:
      min_period: 500ms
      max_period: 5s
      max_retries: 10

scrape_configs:
  - job_name: cloud-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: cloud-logs
          service: cloud-simulator
          __path__: /var/log/cloud/events.jsonl
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339Nano

target_config:
  sync_period: 2s
