name: ${COMPOSE_PROJECT_NAME:-observability-stack}

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: ${COMPOSE_PROJECT_NAME:-observability-stack}-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - node-exporter
      - snmp-exporter
      - snmp-agent
    networks:
      - observability
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: ${COMPOSE_PROJECT_NAME:-observability-stack}-node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containerd/.+|run/.+)$
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    networks:
      - observability
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  snmp-exporter:
    image: prom/snmp-exporter:v0.31.0
    container_name: ${COMPOSE_PROJECT_NAME:-observability-stack}-snmp-exporter
    command:
      - --config.file=/etc/snmp_exporter/snmp.yml
    ports:
      - "127.0.0.1:9116:9116"
    volumes:
      - ./configs/snmp-exporter/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    networks:
      - observability
      - observability-internal
    restart: unless-stopped

  snmp-agent:
    build:
      context: ./simulators/snmp-agent
      dockerfile: Dockerfile
    image: observability-snmp-agent:1.0.0
    container_name: ${COMPOSE_PROJECT_NAME:-observability-stack}-snmp-agent
    expose:
      - "161/udp"
    networks:
      - observability-internal
    restart: unless-stopped

  loki:
    image: grafana/loki:3.6.19
    container_name: ${COMPOSE_PROJECT_NAME:-observability-stack}-loki
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./configs/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - observability
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  cloud-logs:
    build:
      context: ./simulators/cloud-logs
      dockerfile: Dockerfile
    image: observability-cloud-logs:1.0.0
    container_name: ${COMPOSE_PROJECT_NAME:-observability-stack}-cloud-logs
    environment:
      CLOUD_LOG_FILE: /var/log/cloud/events.jsonl
      CLOUD_LOG_INTERVAL_SECONDS: "2"
      CLOUD_LOG_MAX_BYTES: "5242880"
      CLOUD_LOG_BACKUP_COUNT: "3"
    volumes:
      - cloud-logs-data:/var/log/cloud
    network_mode: none
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  promtail:
    image: grafana/promtail:3.6.11
    container_name: ${COMPOSE_PROJECT_NAME:-observability-stack}-promtail
    command:
      - -config.file=/etc/promtail/promtail.yml
    ports:
      - "127.0.0.1:9080:9080"
    volumes:
      - ./configs/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - cloud-logs-data:/var/log/cloud:ro
      - promtail-positions:/positions
    depends_on:
      - loki
      - cloud-logs
    networks:
      - observability
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:12.4.14
    container_name: ${COMPOSE_PROJECT_NAME:-observability-stack}-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-observability-lab}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_CHECK_FOR_UPDATES: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_UNIFIED_ALERTING_ALERTMANAGER_CONFIG_POLL_INTERVAL: 5s
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dashboards/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./dashboards/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dashboards/dashboards:/var/lib/grafana/dashboards:ro
      - ${GRAFANA_ALERTING_DIR:-./dashboards/alerting}:/etc/grafana/provisioning/alerting:ro
    depends_on:
      - prometheus
      - loki
      - webhook-receiver
    networks:
      - observability
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  webhook-receiver:
    build:
      context: ./tools/webhook-receiver
      dockerfile: Dockerfile
    image: observability-webhook-receiver:1.0.0
    container_name: ${COMPOSE_PROJECT_NAME:-observability-stack}-webhook-receiver
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - webhook-data:/data
      - ./dashboards:/project-dashboards:ro
    networks:
      - observability
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    container_name: ${COMPOSE_PROJECT_NAME:-observability-stack}-jaeger
    command: ["--config", "/etc/jaeger/jaeger.yml"]
    ports:
      - "127.0.0.1:16686:16686"
    volumes:
      - ./configs/jaeger/jaeger.yml:/etc/jaeger/jaeger.yml:ro
    networks:
      - observability
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    container_name: ${COMPOSE_PROJECT_NAME:-observability-stack}-otel-collector
    command: ["--config", "/etc/otelcol/otel-collector.yml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./configs/otel-collector/otel-collector.yml:/etc/otelcol/otel-collector.yml:ro
    depends_on:
      - jaeger
    networks:
      - observability
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  service-b:
    build:
      context: ./app
    image: observability-demo-app:1.0.0
    container_name: ${COMPOSE_PROJECT_NAME:-observability-stack}-service-b
    command: ["python", "/app/service-b/main.py"]
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    expose:
      - "8080"
    depends_on:
      - otel-collector
    networks:
      - observability
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  service-a:
    build:
      context: ./app
    image: observability-demo-app:1.0.0
    container_name: ${COMPOSE_PROJECT_NAME:-observability-stack}-service-a
    command: ["python", "/app/service-a/main.py"]
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      WORKER_URL: http://service-b:8080
      JAEGER_PUBLIC_URL: http://localhost:16686
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      - service-b
    networks:
      - observability
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  observability:
    name: ${COMPOSE_PROJECT_NAME:-observability-stack}-network
    driver: bridge
  observability-internal:
    name: ${COMPOSE_PROJECT_NAME:-observability-stack}-internal
    driver: bridge
    internal: true

volumes:
  prometheus-data:
    name: ${COMPOSE_PROJECT_NAME:-observability-stack}-prometheus-data
  loki-data:
    name: ${COMPOSE_PROJECT_NAME:-observability-stack}-loki-data
  grafana-data:
    name: ${COMPOSE_PROJECT_NAME:-observability-stack}-grafana-data
  jaeger-data:
    name: ${COMPOSE_PROJECT_NAME:-observability-stack}-jaeger-data
  cloud-logs-data:
    name: ${COMPOSE_PROJECT_NAME:-observability-stack}-cloud-logs-data
  promtail-positions:
    name: ${COMPOSE_PROJECT_NAME:-observability-stack}-promtail-positions
  webhook-data:
    name: ${COMPOSE_PROJECT_NAME:-observability-stack}-webhook-data
